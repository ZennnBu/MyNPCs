
name: Build MyNPCs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build MyNPCs
        run: mvn -B clean package

      - name: Upload MyNPCs JAR
        uses: actions/upload-artifact@v4
        with:
          name: MyNPCs-JAR
          path: target/MyNPCs.jar
          
